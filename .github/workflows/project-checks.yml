name: Project checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  project-checks:
    name: project-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Test proposed source offline
        run: |
          python3 .github/scripts/check_assets.py
          python3 -m unittest discover -s .github/scripts -p test_assets.py -v
